name = "sentencepiece-org"
main = "worker/index.ts"
compatibility_date = "2025-01-01"
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
[observability]
enabled = true

# 运行时文章层（R254，d1_runtime_scaffold 生成）。只存还没进构建产物的
# 新文章，静态正本优先。刻意不设 run_worker_first：Worker 只接管构建产物里
# 根本不存在的路径（云构建等价闸按 dist manifest 逐文件核 sha256）。
[[d1_databases]]
binding = "DB"
database_name = "sentencepiece-org-content"
database_id = "4c8be45e-2538-450f-ad58-4d68b46d575f"
